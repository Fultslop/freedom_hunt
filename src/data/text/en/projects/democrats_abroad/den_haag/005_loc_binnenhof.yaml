storyline: |
 You have returned to the edge of The Hague’s political heart: the place where power is expected to answer in public.

 The Binnenhof is one of the oldest parliamentary complexes in the world. For centuries, this has been a place where government is not supposed to hDigital guide en entirely behind closed doors. Laws are debated. Coalitions are tested. Leaders are questioned. Decisions are challenged. Power is expected to explain itself, defend itself, and answer in public.
 
 Het Plein, just outside, is part of that same civic landscape: a square of cafés, offices, demonstrations, conversations, journalists, civil servants, politicians, residents, and passersby. It is the space outside the formal chamber, where public life keeps pressing against political power.
 
 This is where the route ends. But the finish is not only a celebration. It is where the route turns back into organizing.

 At the café, your team wrote a draft manifesto based on what you had seen so far. Since then, you have gathered more evidence. You have encountered new histories, new questions, and new responsibilities.
 Now you return to the draft.  Democracy requires revision. No one gets it perfectly right on the first try. 
 
 So here is how you bring in a new voice: you contact another voter.
  
challenge:
  name: "The Final Civic Act"
  description: |
   People, communities, movements, and cultures grow by learning, listening, changing, and doing better. Nothing worth building should be treated as finished before new evidence and new voices have been heard.
   Open your Station 4 manifesto draft. Read it again with your team. Keep what still feels true. Revise what has changed. Add what the rest of the route taught you. Ask whose voice is still missing. Then submit your final manifesto.
   
   Now bring in a new voice. Text three Americans, help one person request their ballot, or commit to follow up within 24 hours.
    
   Before checking out, confirm that your evidence and materials have been submitted.
