storyline: |
  The Binnenhof is the oldest House of Parliament in the world still in use. Since the 15th century, this complex has been the center of Dutch political life — the place where the counts of Holland governed, where the States General convened, and where, today, the Senate and House of Representatives debate the laws that shape the Netherlands.

  This is a working parliament. On any given day, you can walk through the same courtyard as ministers, members of parliament, and journalists. The building does not hide behind gates or security perimeters. It sits in the middle of the city, surrounded by cafés, bookshops, trams, and pedestrians.

  The contrast with the US Capitol is deliberate. In Washington, visitors must book weeks in advance and pass through airport-level security. Here, you can walk from the street into the heart of a legislature in seconds. The openness is itself a democratic statement: government belongs to the people who live under it.

  For American voters abroad, the distance from Washington can feel like a disenfranchisement. But the Binnenhof is a reminder that democracy is not a building in a distant capital. It is a practice that you carry with you — and that you can rejoin from anywhere in the world.
