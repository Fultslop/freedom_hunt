storyline: |
  Malieveld is one of the Netherlands' great public gathering places. It is the field where people come when they want power to hear them: farmers, students, unions, climate activists, anti-war movements, anti-racism organizers, housing advocates, health workers, and many others. Some demonstrations here have been joyful. Some have been angry. Some have been enormous. Some have been tense. But the field's democratic meaning is clear: people gather here because public pressure is part of political life.

  Now you take the message into public space.

  [+] Read more about the Malieveld

  This area also carries a major women's peace history. Near here, on the site of the former Hague Zoo, more than a thousand women gathered in 1915 for the **International Congress of Women**. They came during the First World War to argue that women should not be excluded from decisions about war, peace, diplomacy, and democracy. The congress helped lead to what became the **Women's International League for Peace and Freedom**.

  This station also draws inspiration from Dolle Mina, the Dutch feminist action group that emerged in 1969-1970. Dolle Mina became known for playful, public, media-savvy protest actions demanding equal rights, childcare, sexual freedom, abortion rights, and an end to restrictive gender roles.

  Together, these histories make Malieveld the route's turning point. You have read, remembered, written, and argued. 


