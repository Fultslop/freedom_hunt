- id: source_of_fear
  type: string
  label: What idea in this book was someone afraid of?
  subtext: Think beyond the official reason. Was it queer identity? racial memory? women’s autonomy? grief? migration? sexuality? criticism of state violence? young people thinking for themselves?
  
