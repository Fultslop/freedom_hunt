breadcrumb: |
  The palace represents continuity. But a democracy also needs a place for contestation, for the arguments that shape a society's values. Walk back toward the Korte Voorhout, where the Mauritshuis holds one of the world's great collections of Dutch art — and the arguments a nation makes about itself through what it chooses to preserve.
