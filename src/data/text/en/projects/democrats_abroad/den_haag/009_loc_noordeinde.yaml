storyline: |
  Noordeinde Palace is the official working palace of the King of the Netherlands. It is where the monarch receives foreign heads of state, signs laws into effect, and meets with the prime minister each week. But the king does not govern. The Netherlands is a constitutional monarchy: the monarch is the head of state, but political power rests with the parliament and the elected government.

  This separation is the point. Noordeinde is a place where the symbol of national unity lives apart from the machinery of legislation. The king reigns, but does not rule — a concept that Americans, with their own separation of symbolic and executive power, can recognise. The US president is both head of state and head of government, combining the roles that the Netherlands divides between the monarch and the prime minister.

  For Americans living abroad, the question of representation is immediate. You do not vote for the Dutch king or the Dutch prime minister. But your vote in US elections determines who holds the combined power of head of state and head of government in the country where you are a citizen. The distance does not make your vote less powerful — it makes it one of the most deliberate votes in the American electorate.
