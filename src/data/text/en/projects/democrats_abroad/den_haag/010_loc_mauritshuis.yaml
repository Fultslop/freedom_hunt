storyline: |
  The Mauritshuis is home to the Royal Cabinet of Paintings, including Vermeer's Girl with a Pearl Earring, Rembrandt's The Anatomy Lesson of Dr. Nicolaes Tulp, and works by Jan Steen, Frans Hals, and Carel Fabritius. It is one of the finest collections of Dutch Golden Age painting in the world.

  But a collection is never neutral. What a society chooses to preserve, display, and celebrate tells a story about its values. The Dutch Golden Age was a period of extraordinary artistic achievement — and also of colonialism, slavery, and vast economic inequality. The same merchants who commissioned portraits of themselves and their families also financed the slave trade and the exploitation of colonies.

  The question the Mauritshuis raises is not whether the art is beautiful — it is. The question is whether a democracy can hold two truths at once: that it produced great works of culture, and that it caused great harm. That tension is at the heart of American civic life today, from monuments to school curricula to the stories we tell about the founding of the United States.

  For American voters abroad, this is the work of democracy: to look clearly at the past, to argue about what it means, and to decide what kind of country you want to vote for.
