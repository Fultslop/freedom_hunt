storyline: |
  Grote Markt is one of The Hague’s public living rooms: a square of cafés, bars, terraces, music, conversations, students, workers, friends, strangers, and people passing through.
  
  After books, memorials, manifestos, and protest, this stop brings the route back into ordinary public life. That matters. Democracy is not only defended in courts, parliaments, marches, and moments of crisis. It is also practiced in the everyday work of sharing space with people who are not exactly like you.
  
  Coalitions are built the same way. They are rarely made of people who agree on everything. They are made by finding enough common ground to move together.
  
  At this stop, your team turns that idea into a table.
 
challenge:
  name: "Pocket Coalition"
  description: |
    Find a table at one of the cafés, bars, or pubs on or around **Grote Markt**.
    
    Each team member contributes one random object from their pocket, bag, or coat.
    
    Choose 4 to 5 objects and arrange them into a still life on the table.
    
    Photograph the still life and upload.

    Then write a 5-word caption that identifies the common thread holding these different objects together.

    Examples:
    
    - *“Different tools, same shared future.”*
    - *“Nothing alike, still moving together.”*
    - *“Many pockets, one public square.”*
    - *“Small things, collective survival kit.”*
    - *“Unlikely objects, obvious common cause.”*


  notes: ""
  form: 006_form_grote_markt
