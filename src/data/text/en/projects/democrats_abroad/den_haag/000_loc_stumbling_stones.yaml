address: "All of the Hague"

storyline: |
  **All teams should keep their eyes open across The Hague, especially near the former Jewish Quarter**

  Throughout The Hague, small brass memorial stones are set into the pavement outside the last freely chosen homes of people persecuted by the Nazi regime. These stones are called *Stolpersteine*, or *Stumbling Stones*.  Each stone is small: a 10 x 10 cm concrete block with a brass plate. 

  The plate usually gives the person's name, date of birth, the year and place they were deported, and the date and place of death. The stones are usually placed outside the person's last freely chosen home, if that address still exists.

  [+] Read more about the background of the `Stumbling Stones`

  The project was created by German artist `Gunter Demnig` and has become one of the largest decentralized memorial projects in the world. Instead of gathering memory into one official monument, Stolpersteine scatters memory back into the streets where people lived. The result is a city that remembers through doorways, sidewalks, homes, and ordinary walking routes. 

  In The Hague, the number of stones continues to grow. As of April 2026, 710 Stolpersteine had been placed in Den Haag. They commemorate murdered Jews, resistance members, and others targeted or harmed under Nazism. New stones are still being added: for example, 18 new stones were placed in The Hague on 19 March 2026, including stones for murdered Jews and resistance members.

  The stones are deliberately easy to overlook. They are not tall monuments. They do not stop traffic. They ask for a different kind of attention: to look down, pause, read a name, and realize that the city's history is not somewhere else. 
  
  It is underfoot.

challenge:
  name: "Stumbling Stones Rubbing"
  description: |
    Each team receives a rubbing sheet and a crayon or wax block at registration. Have one member of the team keep an eye out for the stones. Use <a href="https://www.joodserfgoeddenhaag.nl/stolpersteine-struikelstenen-in-den-haag" target="_blank" rel="noopener noreferrer">the map at this link</a>
    to find locations.

    When your team finds a Stolperstein:
      - Stop.
      - Read the name aloud.
      - Take a rubbing of the stone.
      - Note the street or location.
      - Continue the route.
      
      At the finish, teams photograph, scan, or hand in their rubbing sheets. These will become part of the **YES.WE.VOTE Den Haag digital memory artwork**.
      
      This is an optional all-day challenge, but it is one of the most important acts of attention in the event.
      
      **Keep your eyes on the pavement. Democracy leaves evidence in small places**.

