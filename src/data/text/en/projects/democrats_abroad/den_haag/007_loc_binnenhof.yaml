storyline: |
  The route ends beside the Binnenhof and Het Plein, at the edge of The Hague's political heart.
  
  The Binnenhof is one of the oldest parliamentary complexes in the world. For centuries, this has been a place where the government is not supposed to happen entirely behind closed doors. Laws are debated. Coalitions are tested. Leaders are questioned. Decisions are challenged. Power is expected to explain itself, defend itself, and answer in public.
  Het Plein, just outside, is part of that same civic landscape: a square of cafés, offices, demonstrations, conversations, journalists, civil servants, politicians, residents, and passersby. It is the space outside the formal chamber, where public life keeps pressing against political power.
  
  That is why the route ends here.
    
  Your route arrives carrying evidence: banned books, edited speeches, remembered names, protest messages, questioned records, truths carried forward, and the simple fact that every participant began the day by taking action as an overseas voter.

  But the finish is not only a celebration. It is where the route turns back into organizing.
  
  At the café, your team wrote a draft manifesto based on what you had seen so far. Since then, you have gathered more evidence. You have encountered new histories, new questions, and new responsibilities.
  Now you return to the draft.

  Democracy requires revision. People, communities, movements, and cultures grow by learning, listening, changing, and doing better. No one gets it perfectly right on the first try. Nothing worth building should be treated as finished before new evidence and new voices have been heard.
  
  So here is how you bring in a new voice: you contact another voter.
  
  Your team revises what you wrote, declares what you stand for, and then reaches beyond the team to bring someone else into the democratic process.
  
  You began by requesting your ballot.
  You end by helping the next person move closer to theirs.
  The route ends, but the organizing does not.

