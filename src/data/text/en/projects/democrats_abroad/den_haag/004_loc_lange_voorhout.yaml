storyline: |
  Movements are not built only in dramatic public moments. They are also built at tables.

  People organize over coffee, in cafés, in living rooms, on park benches, in app groups,  threads, after meetings, between errands, and in the twenty minutes when someone says, “Okay, what are we actually going to do?”

  The Hague has always been a city of public argument and private negotiation. Around the Plaats and Lange Voorhout, political life, diplomacy, journalism, protest, and civic culture have crossed paths for centuries. This part of the route is your pause: a place to sit down, gather the evidence you have collected so far, and turn it into a shared statement.

  You have started with a ballot. You have found a banned book. You have stripped lies from a speech. You have read the name of a child this city refuses to forget.

  Now your team writes what you stand for — but not as a final answer.

  This manifesto is a draft because democracy requires revision. People, communities, movements, and cultures grow by learning, listening, changing, and doing better. No one gets it perfectly right on the first try. Nothing worth building should be treated as set in stone before new evidence, new voices, and new responsibilities have been heard.

  So write **boldly**. Mean what you say. But stay open.

  You will return to this manifesto at the finish, after the route has given you more to think with.


challenge:
  name: "Draft the Manifesto"
  description: |
    Find a table at a café on the Plaats or along the Lange Voorhout.
    
    As a team, write a short draft of your Overseas Voter Manifesto.

    **Because democracy is never guaranteed, we pledge to keep defending it, fighting for it, and voting for it.** 
    
    Your manifesto can be serious, fierce, poetic, practical, funny, or all of the above. It should sound like your team.
    This is your first draft, not your final word. Treat it as a living statement. Write what you believe now, knowing you will return to it later with new evidence, new questions, and new perspectives from the rest of the route.
    At the finish, your team will revise the manifesto and choose how to declare the final version.

